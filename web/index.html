<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c6af7" />
  <meta name="description" content="UpNext — minimalist task manager" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>UpNext</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./web-styles.css" />

  <!-- Firebase modular SDK via import map -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app":           "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth":          "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore":     "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1 class="logo">UpNext</h1>
    <div class="header-actions">
      <div id="userInfo" class="user-info" hidden>
        <img id="userPhoto" class="user-avatar" src="" alt="" />
        <span id="userName" class="user-name"></span>
        <button id="signOutBtn" class="ghost-btn">Sign out</button>
      </div>
      <button id="signInBtn" class="accent-btn" hidden>Sign in with Google</button>
      <button id="themeBtn" class="icon-btn" title="Toggle theme">◑</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
    </div>
  </header>

  <!-- Add form -->
  <form id="addForm" autocomplete="off">
    <input id="taskInput" type="text"
      placeholder="Add task… (use !, !!, !!! for priority)" />
    <button type="submit" class="add-btn">Add</button>
  </form>

  <!-- Toolbar -->
  <div class="toolbar">
    <span id="taskCount" class="count"></span>
    <div class="spacer"></div>
    <span id="syncStatus" class="sync-status" hidden></span>
    <button id="clearBtn" class="ghost-btn">Clear done</button>
  </div>

  <!-- Task list -->
  <main>
    <ul id="taskList"></ul>
    <div id="emptyState" class="empty" hidden>
      <div class="empty-icon">✓</div>
      <p class="empty-title">No tasks yet</p>
      <p class="empty-hint">Type above and press Enter<br>Double-click to edit • Drag to reorder</p>
    </div>
  </main>

  <!-- Task item template -->
  <template id="taskTpl">
    <li class="task" draggable="true">
      <button class="drag-handle icon-btn" data-role="drag" title="Drag to reorder">⠿</button>
      <label class="checkbox">
        <input type="checkbox" data-role="check" />
        <span class="checkmark"></span>
      </label>
      <div class="task-body">
        <span class="task-title" data-role="title"></span>
        <div class="badges">
          <span class="badge due"      data-role="due"      hidden></span>
          <span class="badge priority" data-role="priority" hidden></span>
        </div>
        <input class="task-edit" data-role="edit" hidden />
      </div>
      <button class="icon-btn delete" data-role="delete" title="Delete">🗑</button>
    </li>
  </template>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn close">×</button>
      </div>
      <div class="modal-body">
        <h3>Notifications</h3>
        <label class="toggle-row">
          <input type="checkbox" id="notifsEnabled" />
          <span>Enable browser notifications</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alertOnTime" />
          <span>Alert when due</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alert5min" />
          <span>Alert 5 min before</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alert15min" />
          <span>Alert 15 min before</span>
        </label>
        <button id="testNotifBtn" class="action-btn">Test notification</button>
        <h3 style="margin-top:10px">Install App</h3>
        <button id="installBtn" class="action-btn" hidden>Install UpNext</button>
        <p id="installNote" class="hint-text">Open in Chrome/Edge for installation.</p>
      </div>
    </div>
  </div>

  <script type="module" src="./web-app.js"></script>
</body>
</html>
