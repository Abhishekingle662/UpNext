<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UpNext</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="titlebar">
<div class="drag-region">UpNext</div>
<div class="actions no-drag">
<div id="userInfo" class="user-info" hidden>
<img id="userPhoto" class="user-photo" src="" alt="User" />
<span id="userName" class="user-name"></span>
<button id="signOutBtn" class="sign-out-btn" title="Sign out">↗</button>
</div>
<button id="signInBtn" class="sign-in-btn" hidden>Sign In</button>
<button id="settingsBtn" title="Settings">⚙️</button>
<button id="themeBtn" title="Toggle theme">🌗</button>
<button id="pinBtn" title="Toggle always on top">📌</button>
<button id="minBtn" title="Minimize">—</button>
<button id="closeBtn" title="Close">×</button>
</div>
</header>




<main>
<form id="newTaskForm" autocomplete="off">
<input id="taskInput" type="text" placeholder="Add a task and press Enter…" />
</form>




<section class="toolbar">
<span id="count"></span>
<div class="spacer"></div>
<button id="clearCompleted" class="ghost">Clear completed</button>
</section>




<div id="empty" class="empty" hidden>
	<div class="empty-icon">🗒️</div>
	<div class="empty-title">No tasks yet</div>
	<div class="empty-sub">Add your first task above and press Enter.</div>
	<div class="empty-hint">Tip: Double‑click to rename • Drag ⋮⋮ to reorder • Add times like "3pm" or "tomorrow 9am"</div>
	</div>
<ul id="list" class="list"></ul>
</main>




<template id="itemTpl">
<li class="item" draggable="true">
<button class="icon-btn drag-handle" data-role="drag" title="Drag to reorder">⋮⋮</button>
<label class="checkbox">
<input type="checkbox" />
<span class="checkmark">✓</span>
</label>
<div class="title" data-role="title"></div>
<div class="meta">
  <span class="badge due" data-role="due" hidden></span>
  <span class="badge priority" data-role="priority" hidden></span>
  </div>
<input class="edit" data-role="edit" />
<button class="icon-btn" data-role="delete" title="Delete">🗑️</button>
</li>
</template>

<!-- Settings Modal -->
<div id="settingsModal" class="modal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2>⚙️ Settings</h2>
      <button id="closeSettings" class="close-btn">×</button>
    </div>
    <div class="modal-body">
      <div class="setting-group">
        <h3>🔔 Notifications</h3>
        <label class="setting-item">
          <input type="checkbox" id="notificationsEnabled" />
          <span>Enable task alerts</span>
        </label>
        <div class="setting-item">
          <label>Alert timing:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" id="alertOnTime" checked /> When due</label>
            <label><input type="checkbox" id="alert5min" checked /> 5 min before</label>
            <label><input type="checkbox" id="alert15min" checked /> 15 min before</label>
          </div>
        </div>
        <label class="setting-item">
          <input type="checkbox" id="soundEnabled" />
          <span>Sound alerts</span>
        </label>
        <div class="setting-item">
          <button id="testNotification" class="test-btn">Test Notification</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./renderer.js" defer></script>
</body>
</html>
