<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com wss://*.firebaseio.com https://*.firebaseio.com; script-src 'self' 'unsafe-inline'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UpNext</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Title bar (custom, draggable) -->
  <header class="titlebar" data-tauri-drag-region>
    <span class="app-name" data-tauri-drag-region>UpNext</span>
    <div class="titlebar-actions">
      <button id="themeBtn"    class="icon-btn" title="Toggle theme">◑</button>
      <button id="pinBtn"      class="icon-btn" title="Always on top">⊕</button>
      <button id="minBtn"      class="icon-btn" title="Minimize">−</button>
      <button id="closeBtn"    class="icon-btn close" title="Close">×</button>
    </div>
  </header>

  <!-- Task input -->
  <form id="addForm" autocomplete="off">
    <input id="taskInput" type="text"
      placeholder="Add task… (use !, !!, !!! for priority)" />
  </form>

  <!-- Toolbar -->
  <div class="toolbar">
    <span id="taskCount" class="count"></span>
    <div class="spacer"></div>
    <button id="settingsBtn" class="ghost-btn">Settings</button>
    <button id="clearBtn"    class="ghost-btn">Clear done</button>
  </div>

  <!-- Task list -->
  <ul id="taskList"></ul>

  <!-- Empty state -->
  <div id="emptyState" class="empty" hidden>
    <div class="empty-icon">✓</div>
    <p class="empty-title">No tasks yet</p>
    <p class="empty-hint">Type above and press Enter.<br>Drag ⠿ to reorder • Double-click to edit</p>
  </div>

  <!-- Task item template -->
  <template id="taskTpl">
    <li class="task" draggable="true">
      <button class="drag-handle icon-btn" data-role="drag" title="Drag to reorder">⠿</button>
      <label class="checkbox">
        <input type="checkbox" data-role="check" />
        <span class="checkmark"></span>
      </label>
      <div class="task-body">
        <span class="task-title" data-role="title"></span>
        <div class="badges">
          <span class="badge due"      data-role="due"      hidden></span>
          <span class="badge priority" data-role="priority" hidden></span>
        </div>
        <input class="task-edit" data-role="edit" hidden />
      </div>
      <button class="icon-btn delete" data-role="delete" title="Delete">🗑</button>
    </li>
  </template>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn close">×</button>
      </div>
      <div class="modal-body">
        <h3>Notifications</h3>
        <label class="toggle-row">
          <input type="checkbox" id="notifsEnabled" />
          <span>Enable task alerts</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alertOnTime" />
          <span>Alert when due</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alert5min" />
          <span>Alert 5 min before</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="alert15min" />
          <span>Alert 15 min before</span>
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="soundEnabled" />
          <span>Sound alerts</span>
        </label>
        <button id="testNotifBtn" class="action-btn">Test notification</button>
      </div>
    </div>
  </div>

  <!-- Load Tauri bridge first, then renderer -->
  <script type="module" src="../tauri-preload.js"></script>
  <script src="./renderer.js" defer></script>
</body>
</html>
